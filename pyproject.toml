[project]
name = "sleep-analysis"
version = "0.1.0"
description = "Análise das noites de sono a partir dos dados do CPAP ResMed AirSense 10"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "garminconnect>=0.3.19",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyedflib>=0.1.38",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.scripts]
sleep-ingest = "sleep_analysis.ingest:main"
sleep-build = "sleep_analysis.build:main"
sleep-garmin-sync = "sleep_analysis.garmin_sync:main"
sleep-update = "sleep_analysis.update:main"
sleep-latest = "sleep_analysis.latest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_analysis"]
